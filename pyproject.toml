[project]
name = "priorformer"
version = "1.0.0"
description = "PriorFormer: a lightweight Transformer lifting 2D joint sequences to 3D with optional geometric priors"
requires-python = ">=3.9"
dependencies = ["numpy", "torch>=2.1", "tqdm"]

[project.optional-dependencies]
onnx = ["onnx", "onnxruntime"]
preprocess = ["human_body_prior"]
dev = ["pytest", "onnx", "onnxruntime"]

[tool.setuptools]
packages = ["priorformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
